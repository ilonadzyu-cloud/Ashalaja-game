<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b100d">
  <title>Десь не там – ядро v0.3</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app">
    <section id="startScreen" class="screen">
      <div class="hero-card">
        <div class="eyebrow">НОВЕ ЯДРО · v0.3</div>
        <h1>ДЕСЬ НЕ ТАМ</h1>
        <p>Технічна збірка ядра. Сюжет переносимо тільки після стабільної перевірки механік.</p>
      </div>
      <section class="panel">
        <h2>Проходження</h2>
        <div id="runSlots"></div>
        <div id="storageStatus" class="small"></div>
      </section>
    </section>

    <section id="gameScreen" class="screen hidden">
      <header class="compactHud">
        <div class="hud-main">
          <div class="eyebrow">ДЕСЬ НЕ ТАМ · CORE v0.3</div>
          <div class="hud-line">
            <b id="timeLine"></b>
            <span id="weatherLine"></span>
            <span id="threatLine"></span>
          </div>
        </div>
        <div id="miniNeeds" class="miniNeeds"></div>
        <button id="backToRuns" class="ghost">Проходження</button>
      </header>

      <details class="panel" id="activeStatesBlock">
        <summary>Активні стани <span id="activeStateCount"></span></summary>
        <div id="activeStates"></div>
      </details>

      <section class="panel">
        <div class="panel-head"><h2>Технічна сцена</h2><span class="badge">не сюжет</span></div>
        <p id="sceneText">Тут перевіряємо, що рішення мають наслідки, але гра не підказує «вигідну» соціальну відповідь.</p>
        <div id="actions" class="actions"></div>
      </section>

      <nav class="tabs">
        <button class="tab active" data-tab="stats">Характеристики</button>
        <button class="tab" data-tab="relations">Стосунки</button>
        <button class="tab" data-tab="clothes">Шмотки</button>
        <button class="tab" data-tab="states">Стани</button>
        <button class="tab" data-tab="weather">Погода</button>
        <button class="tab" data-tab="saves">Сейви</button>
      </nav>
      <section id="tabPanel" class="panel"></section>

      <div id="toast" class="toast hidden"></div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
