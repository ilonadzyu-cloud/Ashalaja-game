<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b100d">
  <title>Десь не там</title>
  <link rel="stylesheet" href="./styles.css?v=063">
</head>
<body>
  <main id="app">
    <section id="startScreen" class="screen start-screen">
      <div class="start-card">
        <div class="version">v0.6.3</div>
        <h1>ДЕСЬ НЕ ТАМ</h1>
        <p class="subtitle">текстова виживалка з комедією, крінжем і хорором</p>
        <div class="start-actions">
          <button id="newGameBtn" class="primary big">Нова гра</button>
          <button id="continueBtn" class="big">Продовжити</button>
        </div>
        <div id="runPicker" class="run-picker hidden"></div>
        <div id="storageStatus" class="storage-status small"></div>
      </div>
    </section>

    <section id="howToScreen" class="screen howto-screen hidden">
      <div class="howto-wrap">
        <div class="howto-head">
          <div class="howto-version">v0.6.3</div>
          <h1 class="howto-title">ДЕСЬ НЕ ТАМ</h1>
          <p class="subtitle">текстова виживалка з комедією, крінжем і хорором</p>
          <div class="howto-kicker">ПЕРЕД ТИМ, ЯК ЛІЗТИ В ЦЕ СЕЛО</div>
        </div>
        <div id="howToIntroCards"></div>
        <div class="howto-start"><button id="beginGameBtn" class="primary big">Почати гру</button></div>
      </div>
    </section>

    <section id="gameScreen" class="game-shell hidden">
      <header class="game-top">
        <div class="top-left">
          <div class="hero-mini"><img id="heroPortrait" class="hero-portrait" src="./hero-face.png" alt="Герой"></div>
          <div class="top-copy">
            <div class="game-name">ДЕСЬ НЕ ТАМ <span>v0.6.3</span></div>
            <div class="world-line"><b id="timeLine"></b><span id="weatherLine"></span><span id="threatLine"></span></div>
          </div>
        </div>
        <div id="miniNeeds" class="mini-needs"></div>
        <div class="top-buttons">
          <button id="menuBtn" class="icon-btn">☰ Меню</button>
          <button id="exitBtn" class="icon-btn ghost">Вийти</button>
        </div>
      </header>

      <section class="stage">
        <div id="stageImage" class="stage-image"></div>

        <div class="quick-row">
          <div class="quick-label">Швидкий доступ</div>
          <div id="quickSlots" class="quick-slots"></div>
        </div>

        <details id="activeStatesBlock" class="active-states">
          <summary>Активні стани <span id="activeStateCount"></span></summary>
          <div id="activeStates"></div>
        </details>

        <article id="storyCard" class="story-card">
          <div id="storyKicker" class="story-kicker">ГЛАВА 1</div>
          <div id="storyText" class="story-text"></div>
          <div id="storyExtras"></div>
          <div id="storyChoices" class="story-actions"></div>
        </article>
      </section>
    </section>

    <div id="menuOverlay" class="menu-overlay hidden" aria-hidden="true">
      <div class="menu-sheet">
        <div class="menu-head">
          <div><div class="menu-title">Меню</div><div id="menuMeta" class="small"></div></div>
          <button id="closeMenuBtn" class="icon-btn">✕</button>
        </div>
        <nav id="menuTabs" class="menu-tabs">
          <button data-tab="inventory" class="active">Інвентар</button>
          <button data-tab="clothes">Шмотки</button>
          <button data-tab="stats">Характеристики</button>
          <button data-tab="states">Стани</button>
          <button data-tab="companions">Компаньйони</button>
          <button data-tab="relations">Стосунки</button>
          <button data-tab="map">Карта</button>
          <button data-tab="shop">Крамничка</button>
          <button data-tab="settings">⚙️ Налаштування</button>
        </nav>
        <section id="menuContent" class="menu-content"></section>
      </div>
    </div>

    <div id="slotPickerOverlay" class="mini-overlay hidden">
      <div class="mini-dialog">
        <div class="menu-head"><div class="menu-title">У який швидкий слот?</div><button id="closeSlotPickerBtn" class="icon-btn">✕</button></div>
        <div id="slotPickerButtons" class="slot-picker-buttons"></div>
      </div>
    </div>


    <div id="stateOverlay" class="state-overlay hidden" aria-hidden="true">
      <div class="state-dialog">
        <div class="state-dialog-title">Стан</div>
        <div id="statePopup"></div>
        <button id="stateOkBtn" class="primary state-ok">Поняв</button>
      </div>
    </div>

    <div id="confirmOverlay" class="confirm-overlay hidden" aria-hidden="true">
      <div class="confirm-dialog">
        <div class="confirm-kicker">НОВА ГРА</div>
        <div id="confirmTitle" class="confirm-title">Почати заново?</div>
        <div id="confirmText" class="confirm-text"></div>
        <div class="confirm-actions">
          <button id="confirmCancelBtn" class="ghost">Скасувати</button>
          <button id="confirmOkBtn" class="danger">Так, почати заново</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
  </main>
  <script type="module" src="./main.js?v=063"></script>
</body>
</html>
